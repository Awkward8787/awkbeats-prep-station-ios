name: PrepStation
options:
  bundleIdPrefix: com.awkbeats
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 5DTN44ACL8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PrepStation:
    type: application
    platform: iOS
    sources: [PrepStation]
    info:
      path: PrepStation/Info.plist
      properties:
        CFBundleDisplayName: Prep Station
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.mp3, com.microsoft.waveform-audio, org.xiph.flac, public.mpeg-4-audio, com.apple.m4a-audio, public.aiff-audio, public.aifc-audio, public.audio]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.xiph.flac
            UTTypeDescription: FLAC audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [flac]
              public.mime-type: [audio/flac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.awkbeats.prepstation
        PRODUCT_NAME: PrepStation
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prep Station
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Prep Station opens your photos only when you pick cover art for a beat."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
  PrepStationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrepStationTests
        excludes: [Fixtures]
      - path: PrepStationTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: PrepStation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.awkbeats.prepstation.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PrepStation.app/PrepStation"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PrepStation:
    build:
      targets:
        PrepStation: all
        PrepStationTests: [test]
    test:
      targets: [PrepStationTests]
